function getKey(pin) {
    if (!/^[0-9]+$/.test(pin)) return "";

    return [...pin]
        .map(digit => _map[Number(digit)])
        .join("");
}
function decodeBase64(data) {
    const binary = atob(data.replace(/\s/g, ""));
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));

    return new TextDecoder().decode(bytes);
}
function decrypt(text, key) {
    let result = "";
    let keyIndex = 0;
    for (const char of text) {
        const code = char.charCodeAt(0);

        if (/[a-z]/i.test(char)) {
            const base = code >= 97 ? 97 : 65;
            const shift = key.charCodeAt(keyIndex % key.length) - 97;

            result += String.fromCharCode(
                ((code - base - shift + 26) % 26) + base
            );

            keyIndex++;
        } else {
            result += char;
        }
    }
    return result;
}
function unlock() {
    const pin = document.getElementById("pin").value;
    const key = getKey(pin);
    const error = document.getElementById("error");
    error.textContent = "";
    if (!key) {
        error.textContent = "Enter a valid numeric PIN.";
        return;
    }
    try {
        const encrypted = decodeBase64(_data);
        const decrypted = decrypt(encrypted, key);
        const firstSeparator = decrypted.indexOf("|");
        const secondSeparator = decrypted.indexOf("|", firstSeparator + 1);
        let pageTitle = "Access";
        let pageHTML = decrypted;
        if (firstSeparator !== -1) {
            if (secondSeparator !== -1) {
                pageTitle = decrypted.substring(
                    firstSeparator + 1,
                    secondSeparator
                );
                pageHTML = decrypted.substring(secondSeparator + 1);
            } else {
                pageTitle = decrypted.substring(firstSeparator + 1);
                pageHTML = decrypted.substring(firstSeparator + 1);
            }
        }
        document.title = pageTitle || "Access";
        const lock = document.getElementById("lock");
        const content = document.getElementById("content");

        lock.style.display = "none";
        content.style.display = "block";
        content.innerHTML = pageHTML;
		content.querySelectorAll("a").forEach(link => {
			link.target = "_blank";
			link.rel = "noopener noreferrer";
		});

    } catch (e) {
        console.error(e);
        error.textContent = e.name + ": " + e.message;
    }
}

document.getElementById("unlockButton").addEventListener("click", unlock);

document.getElementById("pin").addEventListener("keydown", e => {
    if (e.key === "Enter") unlock();
});
